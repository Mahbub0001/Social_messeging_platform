name: Build Android Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .env file
        env:
          SECRET_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SECRET_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          SUPABASE_URL="${SECRET_URL:-https://ngtyysbsfvowtbrqamti.supabase.co}"
          SUPABASE_KEY="${SECRET_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ndHl5c2JzZnZvd3RicnFhbXRpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4ODAxMTEsImV4cCI6MjA5NTQ1NjExMX0.NNRgmbOH0YdzemvnfaLV14duA05pqaAu99Wz1JMVFdM}"
          echo "VITE_SUPABASE_URL=$SUPABASE_URL" > .env
          echo "VITE_SUPABASE_ANON_KEY=$SUPABASE_KEY" >> .env
          echo "Created .env with Supabase URL: $SUPABASE_URL"

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "❌ Error: ANDROID_KEYSTORE_BASE64 secret is not set!"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > android/app/release.keystore
          echo "Keystore decoded successfully. Size: $(wc -c < android/app/release.keystore) bytes."
          if [ ! -s android/app/release.keystore ]; then
            echo "❌ Error: release.keystore is empty after decoding!"
            exit 1
          fi

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Find and verify release APK
        run: |
          echo "Checking generated APKs:"
          find android/app/build/outputs/apk -name "*.apk" -type f
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" -type f | head -n 1)
          fi
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "❌ Error: Release APK not found!"
            exit 1
          fi
          echo "APK_FILE_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "✅ Release APK found at: $APK_PATH"

      - name: Verify APK is signed
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/*/ 2>/dev/null | sort -V | tail -1)
          if [ -n "$BUILD_TOOLS_DIR" ] && [ -f "${BUILD_TOOLS_DIR}apksigner" ]; then
            ${BUILD_TOOLS_DIR}apksigner verify --verbose "$APK_FILE_PATH" && echo "✅ APK signature verified successfully!" || echo "⚠️ APK signature check returned non-zero"
          else
            echo "⚠️ apksigner binary not found in build tools, skipping signature check"
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: ${{ env.APK_FILE_PATH }}
          if-no-files-found: error
